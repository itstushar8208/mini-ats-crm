<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mini ATS/CRM</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-icon">◆</span>
    <span class="brand-name">Mini ATS<span class="brand-accent">/CRM</span></span>
  </div>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="pipeline">Pipeline</button>
    <button class="tab-btn" data-tab="jobs">Jobs</button>
    <button class="tab-btn" data-tab="candidates">Candidates</button>
    <button class="tab-btn" data-tab="clients">Clients</button>
  </nav>
  <div class="api-status" id="apiStatus">
    <span class="dot" id="apiDot"></span>
    <span id="apiStatusText">Checking backend...</span>
  </div>
</header>

<main>

  <!-- ================= PIPELINE / KANBAN ================= -->
  <section id="pipeline" class="tab-panel active">
    <div class="panel-header">
      <h1>Hiring Pipeline</h1>
      <button class="btn btn-primary" id="openAddApplicationBtn">+ Add to Pipeline</button>
    </div>
    <div class="kanban-board" id="kanbanBoard">
      <!-- columns injected by JS -->
    </div>
  </section>

  <!-- ================= JOBS ================= -->
  <section id="jobs" class="tab-panel">
    <div class="panel-header">
      <h1>Jobs</h1>
      <button class="btn btn-primary" id="openAddJobBtn">+ New Job</button>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="jobsTable">
        <thead>
          <tr>
            <th>Title</th>
            <th>Client</th>
            <th>Location</th>
            <th>Status</th>
            <th>Posted</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- ================= CANDIDATES ================= -->
  <section id="candidates" class="tab-panel">
    <div class="panel-header">
      <h1>Candidates</h1>
      <button class="btn btn-primary" id="openAddCandidateBtn">+ New Candidate</button>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="candidatesTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Skills</th>
            <th>Experience</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <!-- ================= CLIENTS ================= -->
  <section id="clients" class="tab-panel">
    <div class="panel-header">
      <h1>Clients</h1>
      <button class="btn btn-primary" id="openAddClientBtn">+ New Client</button>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="clientsTable">
        <thead>
          <tr>
            <th>Company</th>
            <th>Contact person</th>
            <th>Email</th>
            <th>Industry</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

</main>

<!-- ================= MODAL ================= -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">Title</h2>
      <button class="modal-close" id="modalCloseBtn">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
