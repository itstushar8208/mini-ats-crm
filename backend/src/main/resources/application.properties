# Mini ATS/CRM - local development profile
server.port=${PORT:8091}
spring.application.name=mini-ats-crm

# In-memory H2 database for zero-setup local development.
spring.datasource.url=jdbc:h2:mem:atscrmdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console is useful locally. It is disabled in the production profile.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Comma-separated frontend origins. Keep * for local development.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*}

spring.jackson.serialization.write-dates-as-timestamps=false
