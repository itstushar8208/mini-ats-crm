# Production profile for Railway + MySQL.
# Railway provides MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER and MYSQLPASSWORD
# when the MySQL service variables are referenced by the backend service.

server.port=${PORT:8080}

spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=false

# Set this in Railway to your GitHub Pages origin, for example:
# https://itstushar8208.github.io
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

spring.jackson.serialization.write-dates-as-timestamps=false
